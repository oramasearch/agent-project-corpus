[project]
name = "agent-project-corpus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Steve Sperandeo", email = "steve.sperandeo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
]

[project.scripts]
agent-project-corpus = "agent_project_corpus:main"
agent-project-corpus-serve = "agent_project_corpus.service:serve"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
